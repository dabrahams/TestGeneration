---
name: Build and test

"on":
  push:
    branches: [main, rewrite]
    paths-ignore:
      - "Docs/**"
      - "**.md"
      - "README.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "Docs/**"
      - "**.md"
      - "README.md"
      - "LICENSE"
      - ".gitignore"

jobs:
  build-devcontainer:
    name: "Devcontainer: ${{ matrix.host.os }}/${{ matrix.configuration }}"
    strategy:
      fail-fast: false
      matrix:
        host: [
          {
            build-options: "-v --build-tests -Xswiftc -enable-testing",
            test-options: "-v",
          }
        ]
        os: [ubuntu-latest]
        configuration: [debug, release]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - run: git config --global core.autocrlf input

      - name: Build and Test
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            swift build -c ${{ matrix.configuration }} \
              ${{ matrix.host.build-options }} &&

            swift test -c ${{ matrix.configuration }} \
              ${{ matrix.host.test-options }}

  build-native:
    name: "Native: ${{ matrix.os }}/${{ matrix.configuration }}"
    strategy:
      fail-fast: false
      matrix:
        host: [
          {
            build-options: "-v --build-tests -Xswiftc -enable-testing",
            test-options: "-v"
          }
        ]
        os: [macos-15, ubuntu-24.04, windows-2025]
        swift: [{version: "6.3.1"}]
        configuration: [debug, release]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Swift ${{ matrix.swift.version }} on ${{ matrix.os }}
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift.version }}

      - name: Build (${{ matrix.configuration }})
        run: |
          swift build -c ${{ matrix.configuration }} ${{ matrix.host.build-options }}

      - name: Test (${{ matrix.configuration }})
        run: |
          swift test -c ${{ matrix.configuration }} ${{ matrix.host.test-options }}
